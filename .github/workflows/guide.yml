name: Guide (GitHub Pages)

# Le guide d'utilisation en site public (06/11/2026), refait a chaque poussee qui le touche :
# scripts/build_guide.py lit les memes fichiers que la page Guide de l'appli.
on:
  push:
    branches: [master]
    paths:
      - "backend/guide/**"
      - "frontend/src/pages/Guide.jsx"
      - "frontend/src/pages/guide.css"
      - "frontend/src/index.css"
      - "scripts/build_guide.py"
      - ".github/workflows/guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_guide.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
