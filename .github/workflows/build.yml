name: Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # le cache des couches entre deux builds (28/10/2026) : sans lui, l'installation systeme (ffmpeg...), les
          # paquets Python et les modules du frontend etaient refaits a chaque fois, avec une nouvelle empreinte, et
          # Portainer retelechargeait toute l'image a chaque deploiement ; ici seules les couches changees repartent
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_BRANCH=master
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Deploy to Portainer
        if: success()
        run: |
          curl -s -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || true
