services:
  bambunymous:
    image: ghcr.io/an0nym0us63/bambunymous:latest
    container_name: bambunymous
    restart: unless-stopped
    ports:
      - "7914:8000"
    volumes:
      - bambunymous_data:/data
      # Sauvegarde vers le NAS (Parametres > Outils > Sauvegarde et NAS) : le dossier du NAS, monte sur /nas.
      # Remplace ./nas par le chemin du partage sur l'hote (ex. /mnt/nas/bambunymous).
      - ${NAS_PATH:-./nas}:/nas
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=sqlite+aiosqlite:////data/bambunymous.db
      - UPLOADS_DIR=/data/uploads
      # Vue 3D sur une petite machine : laisser de cote les 3MF de plus de N Mo, ou n'en preparer aucune
      # - MW_3D_MAX_MB=100
      # - MW_3D=false
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  bambunymous_data:
